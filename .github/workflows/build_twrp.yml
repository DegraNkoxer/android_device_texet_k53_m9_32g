name: Build TWRP for Texet TM-5702 (MT6753)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        docker rmi $(docker images -q) 2>/dev/null || true
        df -h

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses-dev libxml2-utils xsltproc unzip python3 \
          python-is-python3 bc libssl-dev schedtool rsync lzop \
          libncurses5 libncurses5-dev

    - name: Setup repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Sync TWRP source
      run: |
        mkdir -p ~/twrp && cd ~/twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
        -b twrp-8.1 --depth=1
        repo sync -j4 --force-sync --no-clone-bundle --no-tags

    - name: Clone device tree
      run: |
        git clone https://github.com/DegraNkoxer/android_device_texet_k53_m9_32g.git \
          ~/twrp/device/texet/k53_m9_32g --depth=1

    - name: Fix Python 2 syntax in roomservice.py
      run: |
        sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/' \
          ~/twrp/vendor/omni/build/tools/roomservice.py

    - name: Build TWRP
      run: |
        sudo apt-get install -y openjdk-8-jdk
        export JAVA_HOME=$(find /usr/lib/jvm -maxdepth 1 -name "java-8*" | head -1)
        export PATH=$JAVA_HOME/bin:$PATH
        java -version
        cd ~/twrp
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        lunch omni_k53_m9_32g-eng
        mka recoveryimage -j$(nproc)

    - name: Upload recovery.img
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-TM5702-MT6753-${{ github.run_number }}
        path: ~/twrp/out/target/product/k53_m9_32g/recovery.img
        retention-days: 30
